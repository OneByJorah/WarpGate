[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warpgate"
version = "1.0.0"
description = "Lightweight API gateway and reverse proxy — rate limiting, auth hooks, request routing, and observability with Docker deployment."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "OneByJorah", email = "info@jorahone.com"}]
keywords = ["gateway", "proxy", "api-gateway", "rate-limiting", "docker", "self-hosted", "jorahone"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Systems Administration",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Middleware",
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wartpgate = "warpgate:main"

[project.urls]
Homepage = "https://github.com/OneByJorah/WarpGate"
Repository = "https://github.com/OneByJorah/WarpGate"
Issues = "https://github.com/OneByJorah/WarpGate/issues"

[tool.setuptools.packages.find]
include = ["warpgate*"]
